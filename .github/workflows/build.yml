name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build project
      run: npm run build
      
    - name: Verify build output
      run: |
        if [ ! -d "out" ]; then
          echo "Error: Build output directory 'out/' was not created"
          exit 1
        fi
        if [ -z "$(ls -A out)" ]; then
          echo "Error: Build output directory 'out/' is empty"
          exit 1
        fi
        echo "Build verification successful"
        ls -la out/
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: roui3-build
        path: out/
        retention-days: 90
